# DarkChat - Coturn example configuration

listening-port=3478

# If you later enable TLS:
# tls-listening-port=5349
# cert=/home/container/certs/fullchain.pem
# pkey=/home/container/certs/privkey.pem

fingerprint

# Shared-secret authentication, ideal for temporary credentials
use-auth-secret
static-auth-secret=CHANGE_ME_WITH_A_LONG_RANDOM_SECRET

# Your domain can be used here even if TURN is reached by IP initially
realm=darkchat.fr

# Relay port range: adapt to the ports you allocate in Pterodactyl
min-port=50001
max-port=50101

# Recommended protections
no-multicast-peers
no-cli

# Logging
verbose
simple-log
log-file=stdout

# If the container/server is behind NAT, you may need:
# external-ip=YOUR_PUBLIC_IP
